version: "1.0"
project:
  name: "Additive Self-Healing in Lattice Sumsets"
  repository: "suns1232023/additive-self-healing"
  research_record:
    osf: "https://osf.io/czk8r/"
    paper_version: "2.17"
    doi: "10.17605/OSF.IO/CZK8R"
    rg_doi: "10.13140/RG.2.2.30968.61445"

epistemic_principle: >
  Code can verify a claim; code does not silently upgrade a claim into a theorem.
  Computational verification ≠ mathematical proof.
  Lean kernel verification = formal proof.

formalization:
  system: "Lean 4"
  library: "Mathlib"
  status: "planned"
  purpose:
    - definitions
    - theorem_verification
    - conjecture_formalization

audit:
  sorry_allowed_in_conjectures: true
  proof_modules_require_zero_sorry: true
  axioms_reported: true

results:
  - id: "T3.2"
    name: "Rectangular-box self-healing (d≥2)"
    type: "THEOREM"
    status: "PROVED"
    not_a_proof: false
    proof_method: "Dispersed Corner Decomposition (analytic)"
    computational:
      cases: 12
      engines: [pure_set]
      failures: 0
    lean:
      statement: false
      proof: false
      note: "Formalization planned"

  - id: "T6.1"
    name: "d=1 single-void classification"
    type: "THEOREM"
    status: "PROVED"
    not_a_proof: false
    proof_method: "Permanent missing element argument (analytic)"
    lean:
      statement: false
      proof: false

  - id: "T7.1"
    name: "d=1 multi-void classification"
    type: "THEOREM"
    status: "PROVED"
    not_a_proof: false
    proof_method: "Follows from T6.1"
    lean:
      statement: false
      proof: false

  - id: "M3"
    name: "Single-block healing formula"
    type: "CONJECTURE"
    status: "VHC"
    not_a_proof: true
    formula: "h*(ell,d) = ceil(ell/(d-1)) + 1"
    computational:
      cases: 4640
      scope: "N<=35, ell<=15, d>=2"
      engines: [pure_set, bitwise, formula]
      failures: 0
      fp: 0
      fn: 0
    lean:
      statement: false
      proof: false

  - id: "C14.3"
    name: "Multi-block structural independence"
    type: "CONJECTURE"
    status: "VHC"
    not_a_proof: true
    statement: "h*(V) > pred iff Criterion A or Criterion B"
    computational:
      cases: 875658
      scope: "N<=35, r<=5"
      engines: [pure_set, bitwise]
      failures: 0
      fp: 0
      fn: 0
    lean:
      statement: false
      proof: false

ai_assistance:
  enabled: true
  purpose:
    - formalization_candidate_generation
    - code_review
    - documentation
  epistemic_authority:
    - human_mathematical_definition
    - lean_kernel
  note: >
    AI systems assist formalization but do not constitute mathematical proof.
    The Lean kernel is the final epistemic authority for formal proofs.
    Specific model names are intentionally omitted as models change rapidly.
