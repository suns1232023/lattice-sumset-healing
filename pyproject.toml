[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-sumset-healing"
version = "2.17.0"
description = "Computational verification for additive self-healing in lattice sumsets"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Scott Sun"},
]
keywords = [
    "additive combinatorics",
    "lattice sumsets",
    "Minkowski sums",
    "self-healing",
    "computational mathematics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
"Repository" = "https://github.com/suns1232023/lattice-sumset-healing"
"OSF Project" = "https://osf.io/czk8r/"
"ORCID" = "https://orcid.org/0009-0002-1095-6228"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
