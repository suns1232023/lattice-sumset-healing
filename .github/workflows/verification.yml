name: Full Verification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Verification profile'
        required: true
        default: 'full'
        type: choice
        options: [quick, full]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  full-verification:
    name: Full Verification (${{ github.event.inputs.profile || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV
          pip install -e . || echo "Editable install failed, PYTHONPATH fallback active"

      - name: Verify import
        run: python -c "import self_healing; print('Import OK:', self_healing.__version__)"

      - name: Run verification suite
        run: |
          PROFILE="${{ github.event.inputs.profile || 'full' }}"
          echo "Running profile: $PROFILE"
          python scripts/run_verification.py \
            --profile $PROFILE \
            --output-dir results

      - name: Generate evidence ledger
        run: python scripts/generate_evidence.py

      - name: Verify results
        run: |
          python - <<'PYEOF'
          import json, sys
          with open('results/status.json') as f:
              s = json.load(f)
          print('=== Verification Results ===')
          print('Version: ', s['version'])
          print('Profile: ', s['profile'])
          print('Status:  ', s['status'])
          print('Single-block cases:   ', s['single_block_cases'])
          print('Single-block failures:', s['single_block_failures'])
          print('Multiblock cases:     ', s['multiblock_cases'])
          print('Multiblock TP/TN/FP/FN:', s['multiblock_tp'], s['multiblock_tn'], s['multiblock_fp'], s['multiblock_fn'])
          print('Multiblock failures:  ', s['multiblock_failures'])
          print('Adversarial cases:    ', s['adversarial_cases'])
          print('Adversarial failures: ', s['adversarial_failures'])
          print('Total cases:          ', s['total_cases'])
          print('Total failures:       ', s['failed_cases'])
          print('Runtime:              ', s['runtime_sec'])
          print('NOTE:', s['epistemic_note'])
          if s['status'] != 'PASS' or s['failed_cases'] != 0:
              print('VERIFICATION FAILED')
              sys.exit(1)
          print('VERIFICATION PASSED')
          PYEOF

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: verification-results-${{ github.run_id }}
          path: results/
          retention-days: 90

