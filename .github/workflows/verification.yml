name: Full Verification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Verification profile'
        required: true
        default: 'full'
        type: choice
        options: [quick, full]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  full-verification:
    name: Full Verification (${{ github.event.inputs.profile || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV
          pip install -e . || echo "Editable install failed, PYTHONPATH fallback active"

      - name: Verify import
        run: python -c "import self_healing; print('Import OK:', self_healing.__version__)"

      - name: Run verification suite
        run: |
          PROFILE="${{ github.event.inputs.profile || 'full' }}"
          echo "Running profile: $PROFILE"
          python scripts/run_verification.py \
            --profile $PROFILE \
            --output-dir results

      - name: Generate evidence ledger
        run: python scripts/generate_evidence.py

      - name: Verify results
        run: |
          python -c "
          import json, sys

          with open('results/status.json') as f:
              s = json.load(f)

          print('=== Verification Results ===')
          print(f'Version:  {s[\"version\"]}')
          print(f'Profile:  {s[\"profile\"]}')
          print(f'Status:   {s[\"status\"]}')
          print()
          print(f'Single-block (M3\\'):')
          print(f'  Cases:    {s[\"single_block_cases\"]:,}')
          print(f'  Failures: {s[\"single_block_failures\"]}')
          print()
          print(f'Multi-block (14.3):')
          print(f'  Cases:    {s[\"multiblock_cases\"]:,}')
          print(f'  TP={s[\"multiblock_tp\"]} TN={s[\"multiblock_tn\"]} FP={s[\"multiblock_fp\"]} FN={s[\"multiblock_fn\"]}')
          print(f'  Failures: {s[\"multiblock_failures\"]}')
          print()
          print(f'Adversarial:')
          print(f'  Cases:    {s[\"adversarial_cases\"]:,}')
          print(f'  Failures: {s[\"adversarial_failures\"]}')
          print()
          print(f'Total cases:    {s[\"total_cases\"]:,}')
          print(f'Total failures: {s[\"failed_cases\"]}')
          print(f'Runtime:        {s[\"runtime_sec\"]}s')
          print()
          print('EPISTEMIC NOTE:', s['epistemic_note'])

          if s['status'] != 'PASS':
              print('VERIFICATION FAILED')
              sys.exit(1)
          print('VERIFICATION PASSED')
          "

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: verification-results-${{ github.run_id }}
          path: results/
          retention-days: 90
