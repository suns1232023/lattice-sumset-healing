name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Verify package import
        run: python -c "import self_healing; print(self_healing.__version__)"

      - name: Run core tests
        run: |
          python -m pytest \
            tests/test_sumset.py \
            tests/test_regression.py \
            tests/test_theorem_3_2.py \
            -v --tb=short

      - name: Run M3' tests
        run: python -m pytest tests/test_m3_formula.py -v --tb=short -k "not small_exhaustive"

      - name: Run multiblock tests
        run: python -m pytest tests/test_multiblock.py -v --tb=short -k "not SmallAudit"

  quick-verification:
    name: Quick Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run CI verification
        run: python scripts/run_verification.py --profile ci --output-dir results

      - name: Generate evidence ledger
        run: python scripts/generate_evidence.py

      - name: Assert PASS
        run: |
          python - <<'PY'
          import json
          s = json.load(open("results/status.json"))
          print(f"Status: {s['status']}")
          print(f"Total cases: {s['total_cases']:,}")
          print(f"Failures: {s['failed_cases']}")
          assert s["status"] == "PASS"
          assert s["failed_cases"] == 0
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-${{ github.run_id }}
          path: results/
