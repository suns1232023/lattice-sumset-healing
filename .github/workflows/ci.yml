name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run core tests (theorems + regression)
        run: |
          python -m pytest tests/test_sumset.py \
                           tests/test_regression.py \
                           tests/test_theorem_3_2.py \
                           -v --tb=short

      - name: Run M3' tests (small scope)
        run: |
          python -m pytest tests/test_m3_formula.py \
                           -v --tb=short \
                           -k "not small_exhaustive"

      - name: Run multiblock tests (small scope)
        run: |
          python -m pytest tests/test_multiblock.py \
                           -v --tb=short \
                           -k "not SmallAudit"

  quick-verification:
    name: Quick Verification (CI profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Run CI verification
        run: |
          python scripts/run_verification.py \
            --profile ci \
            --output-dir results

      - name: Generate evidence ledger
        run: python scripts/generate_evidence.py

      - name: Check results
        run: |
          python -c "
          import json, sys
          s = json.load(open('results/status.json'))
          print(f'Status: {s[\"status\"]}')
          print(f'Total cases: {s[\"total_cases\"]:,}')
          print(f'Failures: {s[\"failed_cases\"]}')
          print(f'NOTE: {s[\"epistemic_note\"]}')
          assert s['status'] == 'PASS', f'Verification failed: {s}'
          print('CI verification PASSED')
          "

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-py${{ matrix.python-version }}
          path: results/
