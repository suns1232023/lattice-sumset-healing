name: CI
# Pipeline: install → import test → pytest → quick verification → schema validation → evidence

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify import
        run: python -c "import self_healing; print('Import OK:', self_healing.__version__)"

      - name: Run core tests
        run: |
          python -m pytest tests/test_sumset.py \
                           tests/test_regression.py \
                           tests/test_theorem_3_2.py \
                           -v --tb=short

      - name: Run M3 tests (small scope)
        run: |
          python -m pytest tests/test_m3_formula.py \
                           -v --tb=short \
                           -k "not small_exhaustive"

      - name: Run multiblock tests (small scope)
        run: |
          python -m pytest tests/test_multiblock.py \
                           -v --tb=short \
                           -k "not SmallAudit"

  quick-verification:
    name: Quick Verification (CI profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify import
        run: python -c "import self_healing; print('Import OK:', self_healing.__version__)"

      - name: Run CI verification
        run: python scripts/run_verification.py --profile ci --output-dir results

      - name: Validate schema
        run: python scripts/validate_results.py --results-dir results

      - name: Generate evidence ledger
        run: python scripts/generate_evidence.py --results-dir results

      - name: Final result assertion
        run: |
          python - <<'PYEOF'
          import json, sys
          with open('results/status.json') as f:
              s = json.load(f)
          print(f"Status: {s['status']} | Total: {s['total_cases']:,} | Failures: {s['failed_cases']}")
          assert s['status'] == 'PASS', f"Verification failed: {s['status']}"
          assert s['failed_cases'] == 0, f"Failures found: {s['failed_cases']}"
          assert s['not_a_proof'] is True, "not_a_proof must be True"
          print("CI verification PASSED")
          PYEOF

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-${{ github.run_id }}
          path: results/
